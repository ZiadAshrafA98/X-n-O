# Tells open copies of the game about a new build, on the public relays the
# game already uses for online play:
#   xando/v1/soon  the moment it is pushed: the game says "Update on its way"
#   xando/v1/build once xando.space serves it: the game offers Restart
# Both are hints. The game re-reads version.json itself before it offers to
# restart, so a stray message can never load anything.
name: Announce new build

on:
  push:
    branches: [main]
    paths: [version.json]

concurrency:
  group: announce
  cancel-in-progress: true

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Say it is on its way
        run: |
          V=$(node -p "require('./version.json').v")
          for host in broker.emqx.io broker.hivemq.com; do
            npx -y mqtt@5.10.1 pub -h "$host" -p 1883 -t xando/v1/soon -m "$V" -r -q 1 || echo "could not reach $host"
          done
      - name: Wait for the new build to go live
        id: live
        run: |
          V=$(node -p "require('./version.json').v")
          echo "want $V"
          for i in $(seq 1 120); do
            L=$(curl -fsS -H 'Cache-Control: no-cache' "https://xando.space/version.json?t=$(date +%s%N)" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).v" 2>/dev/null || true)
            if [ "$L" = "$V" ]; then echo "live after $((i*5))s"; echo "v=$V" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          echo "the site never served $V"; exit 1
      - name: Say it is live
        run: |
          for host in broker.emqx.io broker.hivemq.com; do
            npx -y mqtt@5.10.1 pub -h "$host" -p 1883 -t xando/v1/build -m "${{ steps.live.outputs.v }}" -r -q 1 || echo "could not reach $host"
          done
