# Tells open copies of the game about a new build, with a countdown to when
# it goes live. The work is in .github/announce.mjs; it publishes on the
# public relays the game already uses for online play. Both messages are
# hints: the game re-reads version.json itself before it offers to restart.
name: Announce new build

on:
  push:
    branches: [main]
    paths: [version.json]

permissions:
  actions: read
  contents: read

concurrency:
  group: announce
  cancel-in-progress: true

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-audit --no-fund mqtt@5.10.1
      - run: node .github/announce.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
