<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X n O</title>
<meta name="description" content="Tic-tac-toe where each player keeps only 3 marks. Play on one device, against a perfect computer, or online with a friend.">
<meta name="theme-color" content="#101011">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101011; --slab:#1c1c1e; --slab-2:#242427; --ink:#f5f5f5; --ink-2:#d8d8dc; --mute:#9b9ba1; --faint:#8a8a90;
  --chip:rgba(255,255,255,.06); --chip-2:rgba(255,255,255,.1); --tile:rgba(255,255,255,.045); --tile-2:rgba(255,255,255,.08);
  --hair:rgba(255,255,255,.07); --thumb:#2a2a2d; --primary:#f5f5f5; --primary-ink:#0d0d0d; --scrim:rgba(8,8,9,.55);
  --x:#ff7a5c; --o:#5aa2ff; --ai:#a78bfa; --friend:#2dd4bf; --green:#3ecf7a; --amber:#f5b546; --red:#e5484d;
  --g-local:rgba(255,122,92,.13); --g-ai:rgba(167,139,250,.16); --g-online:rgba(94,234,212,.12);
  --float:0 0 0 1px var(--hair),0 2px 6px rgba(0,0,0,.2),0 24px 64px rgba(0,0,0,.5);
  --raise:inset 0 0 0 1px rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.4);
  --out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1); --spring-soft:cubic-bezier(.34,1.36,.64,1);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bs:min(456px,calc(100dvh - 300px));
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f6f7; --slab:#ffffff; --slab-2:#f1f1f3; --ink:#0d0d0d; --ink-2:#2a2a2e; --mute:#5e6073; --faint:#66666c;
  --chip:rgba(0,0,0,.05); --chip-2:rgba(0,0,0,.08); --tile:rgba(0,0,0,.045); --tile-2:rgba(0,0,0,.075);
  --hair:rgba(0,0,0,.08); --thumb:#ffffff; --primary:#0d0d0d; --primary-ink:#ffffff; --scrim:rgba(20,20,24,.28);
  --x:#e0533d; --o:#2f6fdb; --ai:#7c5ce6; --friend:#0f9e8a; --green:#1f9d55; --amber:#c98a14; --red:#d93c41;
  --g-local:rgba(255,122,92,.16); --g-ai:rgba(167,139,250,.2); --g-online:rgba(45,212,191,.16);
  --float:0 0 0 1px var(--hair),0 2px 6px rgba(0,0,0,.05),0 24px 64px rgba(0,0,0,.12);
  --raise:inset 0 0 0 1px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.4 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background-color .4s var(--out),color .4s var(--out)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- glow per mode ---------- */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0}
.glow i{position:absolute;inset:0;opacity:0;transition:opacity .8s var(--out)}
.glow .gl{background:radial-gradient(min(680px,90vw) circle at 50% 54%,var(--g-local),transparent 70%)}
.glow .ga{background:radial-gradient(min(680px,90vw) circle at 50% 54%,var(--g-ai),transparent 70%)}
.glow .go{background:radial-gradient(min(680px,90vw) circle at 50% 54%,var(--g-online),transparent 70%)}
[data-mode="local"] .glow .gl,[data-mode="ai"] .glow .ga,[data-mode="online"] .glow .go{opacity:1}

/* ---------- app frame ---------- */
.app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-rows:auto 1fr}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:20px 40px 0;min-height:76px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--slab);box-shadow:inset 0 0 0 1px var(--hair);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;letter-spacing:-.02em;transition:transform .4s var(--spring)}
.mark:hover{transform:rotate(-8deg) scale(1.06)}
.mark .x{color:var(--x)} .mark .o{color:var(--o)}
.tabs-wrap{position:absolute;left:50%;top:20px;transform:translateX(-50%)}
.icons{display:flex;gap:8px}
.ibtn{width:44px;height:44px;border:0;border-radius:999px;background:var(--chip);color:var(--ink-2);display:flex;align-items:center;justify-content:center;transition:background-color .16s ease,color .16s ease,scale .16s var(--out)}
.ibtn:hover{background:var(--chip-2);color:var(--ink)}
.ibtn:active{scale:.92}
.ibtn[aria-expanded="true"]{background:var(--primary);color:var(--primary-ink)}
.ibtn svg{width:18px;height:18px;transition:transform .45s var(--spring)}
.ibtn:hover svg{transform:rotate(-10deg)}
#btnTheme:hover svg{transform:rotate(-30deg)}

/* ---------- segmented (tabs and settings) ---------- */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:4px;border-radius:999px;background:var(--chip);isolation:isolate}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--mute);font-weight:500;font-size:14px;white-space:nowrap;transition:color .2s ease,scale .16s var(--out)}
.seg button:hover{color:var(--ink)}
.seg button:active{scale:.96}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button svg{width:18px;height:18px;flex:none}
.seg .thumb{position:absolute;z-index:0;top:4px;left:0;height:calc(100% - 8px);border-radius:999px;background:var(--thumb);box-shadow:var(--raise);transition:transform .5s var(--spring-soft),width .5s var(--spring-soft)}
.seg.no-anim .thumb{transition:none}
.seg.sm button{height:34px;padding:0 12px;font-size:13px}
.seg.full{display:grid;width:100%}
.tabs button{padding:0 18px 0 14px}

/* ---------- stage ---------- */
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"pl status pr" "pl board pr" "pl actions pr";align-content:center;row-gap:22px;padding:8px 24px 28px;min-height:0}
.status{grid-area:status;justify-self:center;display:flex;align-items:center;gap:10px;height:36px;padding:0 16px 0 12px;border-radius:999px;background:var(--chip);font-weight:500;font-size:14px;white-space:nowrap;max-width:100%;overflow:hidden}
.status .dot{width:8px;height:8px;border-radius:99px;flex:none;background:var(--dot,var(--x));box-shadow:0 0 0 4px color-mix(in srgb,var(--dot,var(--x)) 22%,transparent);transition:background-color .3s ease,box-shadow .3s ease}
.status.busy .dot{animation:breathe 1.1s ease-in-out infinite alternate}
.status .txt{display:flex;gap:8px;align-items:baseline;overflow:hidden;text-overflow:ellipsis}
.status .txt.swap{animation:meta .26s var(--out) both}
.status .sub{color:var(--mute);font-weight:400}
.status .code{font-family:var(--mono);font-size:13px;color:var(--mute);letter-spacing:.08em}

/* ---------- board + result (wave root) ---------- */
.board-wrap{grid-area:board;justify-self:center;width:var(--bs);height:var(--bs);display:grid;isolation:isolate;border-radius:36px;overflow:hidden}
.board-wrap>*{grid-area:1/1;min-width:0;min-height:0;isolation:isolate}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:calc(var(--bs) * .026);background:var(--bg);transition:background-color .4s var(--out)}
.cell{position:relative;border:0;padding:0;border-radius:calc(var(--bs) * .07);background:var(--tile);display:flex;align-items:center;justify-content:center;transition:background-color .2s ease,scale .18s var(--out),outline-color .2s ease;outline:2px dashed transparent;outline-offset:-10px}
.cell:not(:disabled):hover{background:var(--tile-2)}
.cell:not(:disabled):active{scale:.95}
.cell:disabled{cursor:default}
.mk{font-weight:600;font-size:calc(var(--bs) * .167);line-height:1;pointer-events:none}
.cell.X .mk,.mk.X{color:var(--x)} .cell.O .mk,.mk.O{color:var(--o)}
.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cell.old{outline-color:color-mix(in srgb,var(--x) 55%,transparent)}
.cell.old.O{outline-color:color-mix(in srgb,var(--o) 55%,transparent)}
.cell.old .mk{animation:fade 1.4s ease-in-out infinite}
.cell.win{animation:winlight .9s var(--spring) both}
.age{position:absolute;top:10px;right:13px;font:500 11px var(--mono);color:var(--faint);transition:opacity .2s}
.hint{position:absolute;bottom:9px;left:0;right:0;text-align:center;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;animation:meta .3s var(--out) both}
.hint.W{color:var(--green)} .hint.L{color:var(--red)} .hint.D{color:var(--faint)}
[data-mode="online"]:not([data-net="live"]):not([data-net="lost"]) .board{opacity:.35;transition:opacity .4s var(--out)}

.result{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:var(--slab);text-align:center;border-radius:36px}
.result .orb{width:72px;height:72px}
.res-title{margin:0;font-size:clamp(34px,calc(var(--bs) * .11),52px);font-weight:500;letter-spacing:-.035em;line-height:1.05}
.res-title .x{color:var(--x)} .res-title .o{color:var(--o)}
.res-score{margin:0;font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.res-score b{color:var(--ink);font-weight:500}
.res-actions{display:flex;flex-direction:column;gap:8px;width:min(100%,260px)}

/* ---------- players ---------- */
.player{display:flex;flex-direction:column;align-items:center;gap:12px;justify-self:center;align-self:center;transition:opacity .4s var(--out),transform .5s var(--spring-soft)}
.player.pl{grid-area:pl} .player.pr{grid-area:pr}
.player:not(.on){opacity:.5;transform:scale(.94)}
.pname{font-size:15px;font-weight:500}
.pscore{position:relative;height:56px;min-width:40px;overflow:hidden;font-size:56px;font-weight:500;letter-spacing:-.03em;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.pscore span{display:block}
.pscore span.in{animation:tickin .5s var(--spring-soft) both}
.pscore span.outgoing{position:absolute;inset:0;animation:tickout .3s var(--out) both}
[data-mode="online"]:not([data-net="live"]):not([data-net="lost"]) .player{display:none}

/* ---------- orbs ---------- */
.orb{position:relative;display:block;flex:none;width:72px;height:72px;border-radius:99px;background:radial-gradient(circle at 32% 30%,#ffc2a8,#ff7a5c 45%,#c2410c);transition:box-shadow .4s var(--out)}
.orb.o{background:radial-gradient(circle at 32% 30%,#b9dcff,#5aa2ff 45%,#1d4ed8)}
.orb.ai{background:radial-gradient(circle at 32% 30%,#ddd2ff,#a78bfa 45%,#5b21b6)}
.orb.friend{background:radial-gradient(circle at 32% 30%,#ccfbf1,#2dd4bf 45%,#0f766e)}
.player.on .orb{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--ring,rgba(255,122,92,.6)),0 12px 40px var(--ring-glow,rgba(255,122,92,.3))}
.orb.pop{animation:pop .55s var(--spring) both}
.dots{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:4px}
.dots i{width:5px;height:5px;border-radius:9px;background:#fff;animation:bounce 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
.player.thinking .dots{display:flex}

/* ---------- actions ---------- */
.actions{grid-area:actions;justify-self:center;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font-weight:500;font-size:14px;letter-spacing:-.01em;transition:background-color .16s ease,color .16s ease,scale .16s var(--out),opacity .2s}
.btn:hover{background:var(--chip-2)}
.btn:active{scale:.96}
.btn:disabled{opacity:.4;cursor:not-allowed;scale:1}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{opacity:.9}
.btn.big{height:52px;padding:0 28px 0 22px;font-size:15px}
.btn.round{width:52px;height:52px;padding:0}
.btn.danger{background:var(--red);color:#fff}
.btn.danger-soft{background:color-mix(in srgb,var(--red) 16%,transparent);color:color-mix(in srgb,var(--red) 70%,var(--ink))}
.btn.accent{background:color-mix(in srgb,var(--o) 16%,transparent);color:color-mix(in srgb,var(--o) 70%,var(--ink));height:32px;padding:0 12px 0 10px;font-size:13px}
.btn .lbl{display:inline-block}
.btn .lbl.swap{animation:meta .22s var(--out) both}
[data-mode="online"] #undoBtn{display:none}
[data-mode="online"]:not([data-net="live"]):not([data-net="lost"]) #newBtn{display:none}

.chip{display:flex;align-items:center;gap:12px;height:52px;padding:0 6px 0 8px;border-radius:999px;background:var(--chip);animation:pop .5s var(--spring) both}
.chip .orbs{display:flex}
.chip .orb{width:32px;height:32px;box-shadow:0 0 0 2px var(--slab)}
.chip .orb+.orb{margin-left:-10px}
.chip .orb.away{opacity:.35}
.chip .ccode{font:500 13px var(--mono);letter-spacing:.16em;color:var(--ink-2)}
.chip .btn{height:40px;padding:0 16px;font-size:13px}

/* ---------- online cards ---------- */
.dock{display:contents}
.card{width:min(340px,100%);padding:20px;border-radius:28px;background:var(--slab);box-shadow:var(--float);display:flex;flex-direction:column;gap:18px;animation:cardin .6s var(--spring-soft) both}
@media (min-width:1080px){.app:not([data-mode="online"]) .card,.app[data-net="live"] .card,.app[data-net="lost"] .card{display:none}}
.card.room{grid-area:pl;justify-self:center;align-self:center}
.card.join{grid-area:pr;justify-self:center;align-self:center;animation-delay:.06s}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:16px;font-weight:500;letter-spacing:-.01em}
.pill{height:24px;padding:0 10px;border-radius:999px;background:var(--chip);font-size:12px;line-height:24px;color:var(--ink-2);white-space:nowrap}
.pill.swap{animation:meta .22s var(--out) both}
.seats{display:flex;justify-content:center;gap:28px;padding:6px 0 2px}
.seat-col{display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .5s var(--spring) both}
.seat-col .orb{width:64px;height:64px}
.seat-name{font-size:12px;color:var(--mute)}
.seat-name.me{color:var(--ink);font-weight:500}
.seat{position:relative;width:64px;height:64px;border-radius:99px;border:1.5px dashed var(--hair);display:flex;align-items:center;justify-content:center;gap:4px;transition:border-color .3s}
.seat i{width:5px;height:5px;border-radius:9px;background:var(--friend);opacity:0;transition:opacity .3s}
.seat[data-state="waiting"]{border-color:color-mix(in srgb,var(--friend) 60%,transparent)}
.seat[data-state="waiting"] i{opacity:1;animation:bounce 1s ease-in-out infinite}
.seat[data-state="waiting"] i:nth-child(2){animation-delay:.15s} .seat[data-state="waiting"] i:nth-child(3){animation-delay:.3s}
.seat[data-state="waiting"]::before,.seat[data-state="waiting"]::after{content:"";position:absolute;inset:-2px;border-radius:99px;border:1.5px solid var(--friend);opacity:0;animation:ripple 2s var(--out) infinite}
.seat[data-state="waiting"]::after{animation-delay:1s}
.seat[data-state="filled"]{border:0;background:radial-gradient(circle at 32% 30%,#ccfbf1,#2dd4bf 45%,#0f766e);animation:pop .6s var(--spring) both}
.seat[data-state="filled"] i{display:none}
.code-row{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 18px;border-radius:18px;background:var(--chip)}
.code-row .ccode{font:500 22px var(--mono);letter-spacing:.24em}
.sq{width:40px;height:40px;border:0;border-radius:12px;background:var(--chip);color:var(--ink-2);display:flex;align-items:center;justify-content:center;transition:background-color .16s,scale .16s var(--out)}
.sq:hover{background:var(--chip-2)} .sq:active{scale:.92}
.sq svg{width:16px;height:16px}
.card-actions{display:flex;gap:8px}
.card-actions .grow{flex:1 1 0}
.note{margin:-8px 0 0;font:500 12px var(--mono);color:var(--faint);min-height:0}
.note:empty{display:none}

/* ---------- one-time code ---------- */
.otp{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.otp .c{position:relative;height:60px;border-radius:16px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:500;transition:box-shadow .2s ease,background-color .2s ease,transform .5s var(--spring-soft),opacity .3s,border-radius .4s var(--out)}
.otp .c span{display:block;animation:otpin .3s var(--out) both}
.otp .c.on{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 35%,transparent)}
.otp .c.on::after{content:"";position:absolute;width:2px;height:22px;border-radius:2px;background:var(--ink);animation:breathe 1.1s ease-in-out infinite alternate}
.otp .c.on.has::after{display:none}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;font-size:16px;caret-color:transparent;cursor:text;text-transform:uppercase}
.otp.shake{animation:shake .5s var(--out)}
.otp.shake .c{color:var(--red)}
.otp.busy .c{animation:wave 1s ease-in-out infinite}
.otp.busy .c:nth-child(2){animation-delay:.08s} .otp.busy .c:nth-child(3){animation-delay:.16s} .otp.busy .c:nth-child(4){animation-delay:.24s} .otp.busy .c:nth-child(5){animation-delay:.32s}
.otp.done .c{border-radius:30px;opacity:0}
.otp.done .c:nth-child(1){transform:translateX(200%)} .otp.done .c:nth-child(2){transform:translateX(100%)} .otp.done .c:nth-child(4){transform:translateX(-100%)} .otp.done .c:nth-child(5){transform:translateX(-200%)}
.otp .capsule{position:absolute;left:50%;top:0;height:60px;width:150px;margin-left:-75px;border-radius:30px;background:color-mix(in srgb,var(--green) 18%,var(--slab));color:var(--green);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .2s ease .15s,transform .55s var(--spring) .12s}
.otp.done .capsule{opacity:1;transform:none}
.otp .capsule svg{width:16px;height:16px}
.join-head label{font-size:16px;font-weight:500;letter-spacing:-.01em}

/* ---------- toast ---------- */
.toast{position:fixed;z-index:60;top:18px;left:50%;display:flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 6px;border-radius:999px;background:var(--slab);box-shadow:0 0 0 1px color-mix(in srgb,var(--friend) 35%,transparent),0 12px 40px rgba(0,0,0,.35);font-weight:500;white-space:nowrap;transform:translate(-50%,-140%) scale(.9);opacity:0;transition:transform .6s var(--spring),opacity .25s ease;pointer-events:none}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}
.toast .orb{width:32px;height:32px}
.toast.plain{padding-left:18px}

/* ---------- dialogs ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .3s var(--out);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.scrim.show{opacity:1}
.scrim.clear{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.dlg{position:fixed;z-index:50;background:var(--slab);color:var(--ink);box-shadow:var(--float);outline:none}
.dlg .grab{display:none}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 14px 12px}
.dlg-head h2{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em}
.pop{top:84px;right:40px;width:336px;padding:10px 8px 8px;border-radius:24px;transform-origin:calc(100% - 70px) -8px}
.modal{top:50%;left:50%;width:min(780px,calc(100vw - 48px));max-height:calc(100dvh - 48px);overflow:auto;padding:12px;border-radius:36px;translate:-50% -50%}
.group{padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px}
.group+.group{border-top:1px solid var(--hair)}
.group-label{font-size:12px;color:var(--faint)}
.dlg .foot{padding:8px 10px 4px}

.rules-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rule{margin:0;padding:24px 16px 20px;border-radius:26px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:18px;min-height:240px}
.mini{position:relative;display:grid;grid-template-columns:repeat(3,48px);gap:6px;padding:6px;border-radius:20px;background:var(--tile)}
.mini i{width:48px;height:48px;border-radius:14px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:600;font-size:24px;outline:2px dashed transparent;outline-offset:-5px}
.mini i.X{color:var(--x)} .mini i.O{color:var(--o)}
.mini i.k-win{animation:winloop 2.4s var(--out) infinite}
.mini i.k-win:nth-child(5){animation-delay:.2s} .mini i.k-win:nth-child(9){animation-delay:.4s}
.mini i.k-old{outline-color:color-mix(in srgb,var(--x) 70%,transparent);animation:fade 1.4s ease-in-out infinite}
.mini i.k-gone{animation:goneloop 2.8s var(--out) infinite}
.mini i.k-new{animation:newloop 2.8s var(--spring) infinite}
.mini .badge{position:absolute;top:-10px;right:-14px;height:26px;padding:0 10px;border-radius:999px;font:500 12px var(--sans);line-height:26px;background:color-mix(in srgb,var(--x) 18%,transparent);color:color-mix(in srgb,var(--x) 70%,var(--ink));animation:pop .5s var(--spring) .3s both}
.rule figcaption{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;text-align:center}
.rule .num{font:500 12px var(--mono);color:var(--faint)}

.insight{display:flex;gap:12px}
.heat-wrap{flex:none;width:360px;padding:28px;border-radius:26px;background:var(--tile);display:flex;flex-direction:column;align-items:center;gap:18px}
.heat{display:grid;grid-template-columns:repeat(3,92px);gap:8px}
.heat i{width:92px;height:92px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-style:normal;font-size:15px;font-weight:600;background:var(--chip-2);color:var(--ink-2)}
.heat i.W{background:var(--green);color:#062612;box-shadow:0 10px 30px color-mix(in srgb,var(--green) 30%,transparent)}
.heat i small{font-size:11px;font-weight:500;opacity:.8}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:3px;background:var(--chip-2)}
.legend b.W{background:var(--green)}
.ins-side{flex:1 1 auto;min-width:0;padding:20px 12px 8px 8px;display:flex;flex-direction:column}
.yes{margin:0;font-size:64px;font-weight:500;letter-spacing:-.04em;line-height:1}
.ins-sub{margin:10px 0 0;font-size:17px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:26px}
.stat{padding:16px;border-radius:20px;background:var(--tile)}
.stat b{display:block;font-size:30px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.ins-rule{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:10px}
.ins-close{align-self:flex-end;margin:-8px -4px 0 0}

/* stagger helper for content entering a dialog */
.stag{animation:rise .5s var(--spring-soft) both;animation-delay:calc(var(--i,0) * 45ms + 60ms)}

/* ---------- narrow screens: stacked layout and bottom sheets ---------- */
@media (max-width:1079px){
  :root{--bs:min(calc(100vw - 32px),calc(100dvh - 318px),520px)}
  .top{flex-wrap:wrap;row-gap:14px;padding:max(14px,env(safe-area-inset-top)) 16px 0;min-height:0}
  .tabs-wrap{position:static;transform:none;order:3;width:100%}
  .tabs{display:grid;width:100%}
  .tabs button{padding:0 8px;font-size:13px}
  .tabs button svg{display:none}
  .icons{gap:6px}
  .stage{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"pl status pr" "board board board" "actions actions actions";align-content:start;row-gap:16px;padding:16px 16px max(16px,env(safe-area-inset-bottom))}
  .player{flex-direction:row;gap:10px;align-self:center}
  .player.pr{flex-direction:row-reverse}
  .player .orb{width:44px;height:44px}
  .player .pname{display:none}
  .pscore{font-size:30px;height:32px;min-width:22px}
  .player.on .orb{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ring,rgba(255,122,92,.6))}
  .status{height:32px;font-size:13px;padding:0 12px 0 10px;gap:8px}
  .status .sub{display:none}
  .board-wrap{border-radius:30px}
  .actions{width:100%;flex-wrap:nowrap}
  .actions #newBtn{flex:1 1 auto;height:54px}
  .actions .round{width:54px;height:54px}
  .chip{flex:none;gap:8px}
  .chip .ccode{letter-spacing:.08em}
  .actions #newBtn{min-width:0;padding:0 16px}
  .dock{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;flex-direction:column;gap:14px;max-height:76dvh;overflow:auto;padding:10px 16px max(20px,env(safe-area-inset-bottom));border-radius:30px 30px 0 0;background:var(--slab);box-shadow:var(--float);transform:translateY(0);transition:transform .55s var(--spring-soft)}
  .dock::before{content:"";align-self:center;flex:none;width:40px;height:5px;border-radius:9px;background:var(--chip-2)}
  .dock .card{width:100%;padding:0;background:none;box-shadow:none;border-radius:0;gap:14px;animation:none}
  .dock .card.join{padding-top:14px;border-top:1px solid var(--hair)}
  .dock .seats{padding:0}
  .app:not([data-mode="online"]) .dock,.app[data-net="live"] .dock,.app[data-net="lost"] .dock{transform:translateY(110%);pointer-events:none}
  .app[data-mode="online"]:not([data-net="live"]):not([data-net="lost"]) .actions{visibility:hidden}
  .pop,.modal{top:auto;left:0;right:0;bottom:0;width:auto;translate:none;max-height:88dvh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 12px max(24px,env(safe-area-inset-bottom));transform-origin:50% 100%}
  .dlg .grab{display:block;width:40px;height:5px;margin:0 auto 10px;border-radius:9px;background:var(--chip-2);touch-action:none}
  .rule{min-height:0;padding:16px 8px 14px;gap:12px}
  .mini{grid-template-columns:repeat(3,34px);gap:4px;padding:4px;border-radius:14px}
  .mini i{width:34px;height:34px;border-radius:10px;font-size:17px;outline-offset:-4px}
  .mini .badge{display:none}
  .rule figcaption{flex-direction:column;gap:2px;font-size:13px}
  .insight{flex-direction:column}
  .heat-wrap{width:auto;padding:18px}
  .heat{grid-template-columns:repeat(3,72px)}
  .heat i{width:72px;height:72px;border-radius:20px}
  .yes{font-size:44px}
  .ins-side{padding:6px 6px 0}
  .ins-close{display:none}
}
@media (max-width:1079px) and (max-height:700px){
  :root{--bs:min(calc(100vw - 32px),calc(100dvh - 292px))}
  .stage{row-gap:12px;padding-top:10px}
}

/* ---------- keyframes ---------- */
@keyframes meta{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes breathe{from{opacity:1}to{opacity:.25}}
@keyframes fade{0%,100%{opacity:.4}50%{opacity:.15}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
@keyframes ripple{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
@keyframes tickin{from{transform:translateY(60%);opacity:0;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}
@keyframes tickout{to{transform:translateY(-60%);opacity:0;filter:blur(3px)}}
@keyframes otpin{from{transform:translateY(45%) scale(.86);opacity:0;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(3px)}75%{transform:translateX(-1px)}}
@keyframes wave{0%,100%{transform:none}30%{transform:translateY(-3px) scale(.95)}}
@keyframes winlight{0%{background:var(--tile);transform:scale(1)}45%{transform:scale(1.06)}100%{background:color-mix(in srgb,var(--green) 24%,transparent);transform:none}}
@keyframes winloop{0%,15%{background:var(--tile)}35%,80%{background:color-mix(in srgb,var(--green) 26%,transparent)}100%{background:var(--tile)}}
@keyframes goneloop{0%,30%{opacity:1;transform:none}50%,85%{opacity:0;transform:scale(.4) rotate(14deg)}100%{opacity:1;transform:none}}
@keyframes newloop{0%,40%{opacity:0;transform:translateY(-8px) scale(.3) rotate(-22deg)}60%,90%{opacity:1;transform:none}100%{opacity:0;transform:scale(.6)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.12s!important}
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i class="gl"></i><i class="ga"></i><i class="go"></i></div>

<div class="app" id="app" data-mode="local" data-net="idle">
  <header class="top">
    <span class="mark" aria-label="X n O"><span class="x">X</span><span class="o">O</span></span>
    <div class="tabs-wrap">
      <div class="seg tabs" id="tabs" role="group" aria-label="Game mode">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" data-mode="local" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1"/><circle cx="9" cy="7" r="4"/><path d="M22 19v-1a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Same device</button>
        <button type="button" data-mode="ai" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg>Computer</button>
        <button type="button" data-mode="online" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Online</button>
      </div>
    </div>
    <div class="icons">
      <button class="ibtn" id="btnRules" type="button" aria-label="Rules" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
      <button class="ibtn" id="btnInsight" type="button" aria-label="Can it be won?" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/></svg></button>
      <button class="ibtn" id="btnSettings" type="button" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.5"/><circle cx="10" cy="12" r="2.5"/><circle cx="18" cy="18" r="2.5"/></svg></button>
      <button class="ibtn" id="btnTheme" type="button" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <p class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span class="txt"></span></p>

    <div class="player pl" id="pX"><span class="orb" id="pXorb"><span class="dots"><i></i><i></i><i></i></span></span><span class="pname" id="pXname">Player X</span><span class="pscore" id="pXscore" aria-label="X score"><span>0</span></span></div>
    <div class="player pr" id="pO"><span class="orb o" id="pOorb"><span class="dots"><i></i><i></i><i></i></span></span><span class="pname" id="pOname">Player O</span><span class="pscore" id="pOscore" aria-label="O score"><span>0</span></span></div>

    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board" role="grid" aria-label="Board"></div>
      <div class="result" id="result" inert aria-hidden="true" style="opacity:0;pointer-events:none">
        <span class="orb" id="resOrb"></span>
        <h2 class="res-title" id="resTitle"></h2>
        <p class="res-score" id="resScore"></p>
        <div class="res-actions">
          <button class="btn primary big" id="playAgain" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Play again</button>
          <button class="btn" id="seeBoard" type="button">See board</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary big" id="newBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>New round</button>
      <button class="btn round" id="undoBtn" type="button" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <div class="chip" id="chip" hidden>
        <span class="orbs"><span class="orb" id="chipMe"></span><span class="orb friend" id="chipFriend"></span></span>
        <span class="ccode" id="chipCode"></span>
        <button class="btn danger-soft" id="chipLeave" type="button">Leave</button>
      </div>
    </div>

    <div class="dock" id="dock">
      <section class="card room" id="roomCard" aria-labelledby="rcTitle">
        <div class="card-head"><span class="card-title" id="rcTitle">Play a friend</span><span class="pill" id="rcPill" hidden></span></div>
        <div class="seats">
          <div class="seat-col"><span class="orb" id="meOrb"></span><span class="seat-name me">You</span></div>
          <div class="seat-col"><span class="seat" id="seat" data-state="empty"><i></i><i></i><i></i></span><span class="seat-name" id="seatName">Friend</span></div>
        </div>
        <div class="code-row" id="codeRow" hidden><span class="ccode" id="rcCode"></span><button class="sq" id="copyCode" type="button" aria-label="Copy room code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>
        <div class="card-actions">
          <button class="btn primary grow" id="createRoom" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Create room</button>
          <button class="btn primary grow" id="inviteBtn" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><span class="lbl" id="inviteLbl">Copy invite link</span></button>
          <button class="btn danger" id="leaveRoom" type="button" hidden>Leave</button>
        </div>
        <p class="note" id="netNote" aria-live="polite"></p>
      </section>

      <section class="card join" id="joinCard" aria-label="Join with a code">
        <div class="card-head join-head"><label for="otpInput">Join with a code</label><button class="btn accent" id="pasteBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>Paste</button></div>
        <div class="otp" id="otp">
          <span class="c"></span><span class="c"></span><span class="c"></span><span class="c"></span><span class="c"></span>
          <span class="capsule" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Joined</span>
          <input id="otpInput" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="5" aria-label="5 character room code" data-1p-ignore data-lpignore="true" data-form-type="other">
        </div>
        <button class="btn" id="joinBtn" type="button" disabled>Join room<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </section>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="orb friend" id="toastOrb"></span><span id="toastTxt"></span></div>
<div class="scrim" id="scrim" hidden></div>

<section class="dlg pop" id="dlgSettings" role="dialog" aria-modal="true" aria-labelledby="setTitle" tabindex="-1" hidden>
  <span class="grab" aria-hidden="true"></span>
  <div class="dlg-head"><h2 id="setTitle">Settings</h2><button class="sq" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="group stag" data-for="ai"><span class="group-label" id="gl-level">Level</span><div class="seg sm full" data-opt="level" role="group" aria-labelledby="gl-level"><span class="thumb"></span><button type="button" data-v="easy">Easy</button><button type="button" data-v="medium">Medium</button><button type="button" data-v="perfect">Perfect</button></div></div>
  <div class="group stag" data-for="ai"><span class="group-label" id="gl-you">You play</span><div class="seg sm full" data-opt="youAre" role="group" aria-labelledby="gl-you"><span class="thumb"></span><button type="button" data-v="X">X, first</button><button type="button" data-v="O">O, second</button></div></div>
  <div class="group stag"><span class="group-label" id="gl-rule">Oldest mark leaves</span><div class="seg sm full" data-opt="rule" role="group" aria-labelledby="gl-rule"><span class="thumb"></span><button type="button" data-v="A">After you place</button><button type="button" data-v="B">Before</button></div></div>
  <div class="group stag" data-hide="online"><span class="group-label" id="gl-hints">Solver hints</span><div class="seg sm full" data-opt="hints" role="group" aria-labelledby="gl-hints"><span class="thumb"></span><button type="button" data-v="0">Off</button><button type="button" data-v="1">On</button></div></div>
  <div class="group stag"><span class="group-label" id="gl-age">Mark order numbers</span><div class="seg sm full" data-opt="age" role="group" aria-labelledby="gl-age"><span class="thumb"></span><button type="button" data-v="0">Off</button><button type="button" data-v="1">On</button></div></div>
  <div class="group stag"><span class="group-label" id="gl-alt">Who starts next round</span><div class="seg sm full" data-opt="alt" role="group" aria-labelledby="gl-alt"><span class="thumb"></span><button type="button" data-v="1">Take turns</button><button type="button" data-v="0">Same player</button></div></div>
  <div class="foot stag"><button class="btn" id="resetScore" type="button" style="width:100%">Reset score</button></div>
</section>

<section class="dlg modal" id="dlgRules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle" tabindex="-1" hidden>
  <span class="grab" aria-hidden="true"></span>
  <div class="dlg-head"><h2 id="rulesTitle">How it works</h2><button class="sq" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="rules-grid" id="rulesGrid"></div>
</section>

<section class="dlg modal" id="dlgInsight" role="dialog" aria-modal="true" aria-labelledby="insTitle" tabindex="-1" hidden>
  <span class="grab" aria-hidden="true"></span>
  <div class="insight">
    <div class="heat-wrap stag">
      <span class="group-label" style="font-family:var(--mono)">X opens here</span>
      <div class="heat" id="heat" aria-label="Opening values: edges force a win, center and corners draw"></div>
      <div class="legend"><span><b class="W"></b>Forced win</span><span><b></b>Draw</span></div>
    </div>
    <div class="ins-side">
      <button class="sq ins-close" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <h2 class="yes stag" id="insTitle" style="--i:1">Yes.</h2>
      <p class="ins-sub stag" id="insSub" style="--i:2">X wins by opening on an edge.</p>
      <div class="stats">
        <div class="stat stag" style="--i:3"><b id="statMoves">7</b><span>moves to force it</span></div>
        <div class="stat stag" style="--i:4"><b id="statPos" data-n="66682">66,682</b><span>positions solved</span></div>
      </div>
      <div class="ins-rule stag" style="--i:5"><span class="group-label" id="gl-rule2">Oldest mark leaves</span><div class="seg sm full" data-opt="rule" role="group" aria-labelledby="gl-rule2"><span class="thumb"></span><button type="button" data-v="A">After you place</button><button type="button" data-v="B">Before</button></div></div>
    </div>
  </div>
</section>

<script src="mqtt.min.js"></script>
<script>
(() => {
"use strict";
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
const app=$("app");

/* ---------- Solver ---------- */
function winLine(p){if(p.length<3)return null;for(const L of LINES)if(L.every(c=>p.includes(c)))return L;return null}
function legal(me,op,rule){
  const occ=new Set(op);
  const mine=(rule==="B"&&me.length===3)?me.slice(1):me;
  mine.forEach(c=>occ.add(c));
  const r=[];for(let c=0;c<9;c++)if(!occ.has(c))r.push(c);return r;
}
function place(me,c){const n=me.concat([c]);return n.length>3?n.slice(1):n}
const key=(me,op)=>me.join("")+"|"+op.join("");
const solved={};
function solve(rule){
  if(solved[rule])return solved[rule];
  const states=new Map(); // key -> {me,op,succ:[], winNow}
  const q=[[[],[]]];states.set(key([],[]),null);
  const list=[];
  while(q.length){
    const [me,op]=q.pop();const k=key(me,op);
    const s={me,op,succ:[],winNow:false};states.set(k,s);list.push(k);
    for(const c of legal(me,op,rule)){
      const nm=place(me,c);
      if(winLine(nm)){s.winNow=true;continue}
      const nk=key(op,nm);s.succ.push(nk);
      if(!states.has(nk)){states.set(nk,null);q.push([op,nm])}
    }
  }
  const pred=new Map(),cnt=new Map(),val=new Map(),dist=new Map();
  for(const k of list){pred.set(k,[]);}
  for(const k of list){const s=states.get(k);cnt.set(k,s.succ.length);for(const n of s.succ)pred.get(n).push(k)}
  const queue=[];
  for(const k of list){const s=states.get(k);
    if(s.winNow){val.set(k,"W");dist.set(k,1);queue.push(k)}
    else if(s.succ.length===0){val.set(k,"L");dist.set(k,0);queue.push(k)}}
  for(let i=0;i<queue.length;i++){const k=queue[i];const v=val.get(k);
    for(const p of pred.get(k)){if(val.has(p))continue;
      if(v==="L"){val.set(p,"W");dist.set(p,dist.get(k)+1);queue.push(p)}
      else{const c=cnt.get(p)-1;cnt.set(p,c);if(c===0){val.set(p,"L");dist.set(p,dist.get(k)+1);queue.push(p)}}}}
  return solved[rule]={val,dist,count:list.length};
}
/* evaluate each legal move for the mover: result from mover's view */
function evalMoves(me,op,rule){
  const {val,dist}=solve(rule);const out=[];
  for(const c of legal(me,op,rule)){
    const nm=place(me,c);
    if(winLine(nm)){out.push({c,v:"W",d:1});continue}
    const nk=key(op,nm);const ov=val.get(nk)||"D";
    out.push({c,v:ov==="W"?"L":ov==="L"?"W":"D",d:(dist.get(nk)??99)+1});
  }
  return out;
}
function pickMove(me,op,rule,level){
  const ms=evalMoves(me,op,rule);
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const wins=ms.filter(m=>m.v==="W"),draws=ms.filter(m=>m.v==="D"),losses=ms.filter(m=>m.v==="L");
  const immediate=ms.filter(m=>m.d===1&&m.v==="W");
  const best=()=>{
    if(wins.length){const md=Math.min(...wins.map(m=>m.d));return rnd(wins.filter(m=>m.d===md)).c}
    if(draws.length)return rnd(draws).c;
    const mx=Math.max(...losses.map(m=>m.d));return rnd(losses.filter(m=>m.d===mx)).c;
  };
  if(level==="perfect")return best();
  if(immediate.length)return immediate[0].c;
  // block opponent's immediate win when possible
  const safe=ms.filter(m=>{const nm=place(me,m.c);return !legal(op,nm,rule).some(c=>winLine(place(op,c)))});
  if(level==="medium")return Math.random()<.6?best():(safe.length?rnd(safe).c:rnd(ms).c);
  return Math.random()<.5&&safe.length?rnd(safe).c:rnd(ms).c;
}

/* ---------- Options (segmented controls) ---------- */
const defaults={level:"medium",youAre:"X",rule:"A",hints:"0",age:"1",alt:"1"};
let opt=store.get("xo.opt",null);
if(!opt){ // carry over settings from the previous version of the site
  opt={...defaults,rule:store.get("xo.rule","A"),hints:store.get("xo.hints",false)?"1":"0",
    age:store.get("xo.age",true)?"1":"0",alt:store.get("xo.alt",true)?"1":"0",level:store.get("xo.level","medium")};
}
opt={...defaults,...opt};
const saveOpt=()=>store.set("xo.opt",opt);

/* ---------- Game state ---------- */
let mode="local",rule=opt.rule==="B"?"B":"A";
let marks={X:[],O:[]},turn="X",starter="X",over=false,winCells=null,history=[];
let score=store.get("xo.score",{X:0,O:0});
const names={X:"Player X",O:"Player O"};
let me=null,aiSide="O",aiTimer=null;
/* online state lives up here so render() can read it from the first call */
let rejected=false,clients=[],room=null,isHost=false,partner=null,partnerSeen=0,connOpen=false;
let myId=null,seq=0,version=0,seen=new Set(),pingTimer=null,joinTimer=null,joinDeadline=0;
let netShown="idle",joinedTimer=null;

/* ---------- Board cells ---------- */
const boardEl=$("board");
const cells=[],shown=Array(9).fill("");
for(let i=0;i<9;i++){
  const b=document.createElement("button");b.type="button";b.className="cell";
  const mk=document.createElement("span");mk.className="mk";
  const age=document.createElement("span");age.className="age";
  const hint=document.createElement("span");hint.className="hint";hint.hidden=true;
  b.append(mk,age,hint);b._mk=mk;b._age=age;b._hint=hint;
  b.addEventListener("click",()=>onCell(i));boardEl.appendChild(b);cells.push(b);
}
/* A mark lands: it drops from a little above with a turn on it and overshoots
   on the way to rest, so placing reads as a token being put down. */
function landMark(mk){
  if(still)return;
  mk.animate([
    {transform:"translateY(-18%) scale(.2) rotate(-22deg)",opacity:0},
    {transform:"translateY(3%) scale(1.1) rotate(5deg)",opacity:1,offset:.55},
    {transform:"scale(.97) rotate(-2deg)",offset:.8},
    {transform:"none",opacity:1}
  ],{duration:520,easing:"cubic-bezier(.22,1,.36,1)"});
}
/* Leaving is the same move backwards and quicker. */
function exitMark(b,side){
  if(still)return;
  const g=document.createElement("span");g.className="ghost";g.setAttribute("aria-hidden","true");
  const m=document.createElement("span");m.className="mk "+side;m.textContent=side;g.appendChild(m);b.appendChild(g);
  const a=m.animate([{opacity:.55,transform:"none"},{opacity:0,transform:"translateY(-8%) scale(.25) rotate(16deg)"}],{duration:260,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"});
  a.onfinish=()=>g.remove();
}

function other(s){return s==="X"?"O":"X"}
function newRound(st){
  marks={X:[],O:[]};over=false;winCells=null;history=[];
  turn=starter=st||starter;render();maybeAI();
}
function applyMove(c){
  if(over)return false;
  const opp=marks[other(turn)];
  if(!legal(marks[turn],opp,rule).includes(c))return false;
  history.push({X:marks.X.slice(),O:marks.O.slice(),turn});
  marks[turn]=place(marks[turn],c);
  const wl=winLine(marks[turn]);
  if(wl){over=true;winCells=wl;score[turn]++;store.set("xo.score",score)}
  else turn=other(turn);
  render();return true;
}
function onCell(c){
  if(over)return;
  if(mode==="ai"&&turn===aiSide)return;
  if(mode==="online"){if(!room||!connOpen||turn!==me)return;if(applyMove(c))pushState();return}
  if(applyMove(c))maybeAI();
}
function maybeAI(){
  clearTimeout(aiTimer);
  if(mode!=="ai"||over||turn!==aiSide)return;
  aiTimer=setTimeout(()=>{const c=pickMove(marks[turn],marks[other(turn)],rule,opt.level);applyMove(c)},560);
}

/* ---------- Rendering ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function kindOf(s){
  if(mode==="ai"&&s===aiSide)return"ai";
  if(mode==="online"&&me&&s!==me)return"friend";
  return s==="O"?"o":"";
}
const ringVar={"":"--x",o:"--o",ai:"--ai",friend:"--friend"};

function renderBoard(){
  const legalSet=new Set(over?[]:legal(marks[turn],marks[other(turn)],rule));
  const showHints=opt.hints==="1"&&!over&&mode!=="online"&&!(mode==="ai"&&turn===aiSide);
  const hints=showHints?Object.fromEntries(evalMoves(marks[turn],marks[other(turn)],rule).map(m=>[m.c,m])):{};
  const showAge=opt.age==="1";
  const myTurnOK=!(mode==="ai"&&turn===aiSide)&&!(mode==="online"&&(turn!==me||!connOpen));
  for(let i=0;i<9;i++){
    const b=cells[i];let side="",idx=-1;
    for(const s of ["X","O"]){const k=marks[s].indexOf(i);if(k>=0){side=s;idx=k}}
    if(shown[i]!==side){
      if(shown[i])exitMark(b,shown[i]);
      b._mk.textContent=side;b._mk.className="mk"+(side?" "+side:"");
      if(side)landMark(b._mk);
      shown[i]=side;
    }
    b.classList.toggle("X",side==="X");b.classList.toggle("O",side==="O");
    const old=!over&&!!side&&side===turn&&marks[side].length===3&&idx===0;
    b.classList.toggle("old",old);
    b._age.textContent=showAge&&side?String(idx+1):"";
    const h=hints[i];
    if(h){const t=h.v==="W"?"win "+Math.ceil(h.d/2):h.v==="L"?"lose":"draw";
      if(b._hint.hidden||b._hint.textContent!==t){b._hint.textContent=t;b._hint.className="hint "+h.v;b._hint.hidden=false}}
    else b._hint.hidden=true;
    const w=winCells?winCells.indexOf(i):-1;
    b.classList.toggle("win",w>=0);b.style.animationDelay=w>=0?(w*90)+"ms":"";
    b.disabled=over||!legalSet.has(i)||!myTurnOK;
    b.setAttribute("aria-label",`Cell ${i+1}: ${side||"empty"}${old?", fades next":""}`);
  }
}

let lastStatus="";
function setStatus(dot,html,busy){
  const el=$("status");el.style.setProperty("--dot",dot);el.classList.toggle("busy",!!busy);
  if(lastStatus===html)return;lastStatus=html;
  const t=el.querySelector(".txt");t.innerHTML=html;
  if(!still){t.classList.remove("swap");void t.offsetWidth;t.classList.add("swap")}
}
function renderStatus(){
  const sideVar=s=>s==="X"?"var(--x)":"var(--o)";
  if(over){
    const w=names[turn];
    setStatus("var(--green)",w==="You"?"You win":mode==="ai"&&turn===aiSide?"Computer wins":mode==="online"?"Friend wins":`${turn} wins`);
    return;
  }
  if(mode==="online"){
    const s=netState();
    if(s==="idle")return setStatus("var(--friend)","Create a room or join one");
    if(s==="host-wait")return setStatus("var(--amber)",`Waiting for your friend<span class="code">${esc(room)}</span>`,true);
    if(s==="guest-wait")return setStatus("var(--amber)",`Looking for room<span class="code">${esc(room)}</span>`,true);
    if(s==="full")return setStatus("var(--red)","That room is full");
    if(s==="lost")return setStatus("var(--amber)","Your friend is offline",true);
    return turn===me?setStatus("var(--green)","Your turn"):setStatus("var(--friend)","Friend's turn",true);
  }
  if(mode==="ai")return turn===aiSide?setStatus("var(--ai)","Computer is thinking",true):setStatus(sideVar(turn),"Your turn");
  const sub=marks[turn].length===3?`<span class="sub">oldest ${turn} fades next</span>`:"";
  setStatus(sideVar(turn),`${turn} to move${sub}`);
}

function tick(el,val){
  const cur=[...el.children].find(n=>!n.classList.contains("outgoing"));
  if(cur&&cur.textContent===String(val))return;
  const n=document.createElement("span");n.textContent=val;
  if(cur){if(still)cur.remove();else{cur.className="outgoing";setTimeout(()=>cur.remove(),320);n.className="in"}}
  el.appendChild(n);
}
function renderPlayers(){
  for(const s of ["X","O"]){
    const el=$("p"+s),orb=$("p"+s+"orb"),k=kindOf(s);
    orb.className="orb"+(k?" "+k:"");
    el.style.setProperty("--ring",`color-mix(in srgb,var(${ringVar[k]}) 60%,transparent)`);
    el.style.setProperty("--ring-glow",`color-mix(in srgb,var(${ringVar[k]}) 30%,transparent)`);
    el.classList.toggle("on",turn===s);
    el.classList.toggle("thinking",mode==="ai"&&!over&&turn===aiSide&&s===aiSide);
    $("p"+s+"name").textContent=names[s];
    tick($("p"+s+"score"),score[s]);
  }
}
function render(){
  renderBoard();renderPlayers();renderNet();renderStatus();
  $("undoBtn").disabled=mode==="online"||history.length===0;
  $("newBtn").disabled=mode==="online"&&!connOpen;
  syncWave();
}

function nextStarter(){return opt.alt==="1"?other(starter):starter}
$("newBtn").addEventListener("click",()=>{
  if(mode==="online"){if(!room||!connOpen)return;newRound(nextStarter());pushState();return}
  if(mode==="ai")aiSide=other(opt.youAre);
  newRound(history.length||over?nextStarter():starter);
});
$("undoBtn").addEventListener("click",()=>{
  if(mode==="online"||!history.length)return;
  clearTimeout(aiTimer);
  const steps=(mode==="ai"&&history.length>=2&&!(over&&turn!==aiSide))?2:1;
  for(let k=0;k<steps&&history.length;k++){
    if(over){score[turn]--;store.set("xo.score",score)}
    const h=history.pop();marks={X:h.X,O:h.O};turn=h.turn;over=false;winCells=null;
  }
  render();maybeAI();
});
$("resetScore").addEventListener("click",()=>{score={X:0,O:0};store.set("xo.score",score);render();if(mode==="online"&&room)pushState();toast("Score reset")});

/* ---------- Segmented controls ---------- */
/* The thumb is placed from the pressed button's own box, so the labels can
   change length without the control jumping. It travels on a spring that
   overshoots a touch, which is what makes it read as sliding. */
function placeThumb(seg,animate){
  const on=seg.querySelector('button[aria-pressed="true"]'),th=seg.querySelector(".thumb");
  if(!on||!th||!seg.offsetParent)return;
  if(!animate)seg.classList.add("no-anim");
  th.style.width=on.offsetWidth+"px";th.style.transform=`translateX(${on.offsetLeft}px)`;
  if(!animate){void th.offsetWidth;seg.classList.remove("no-anim")}
}
function setSeg(seg,val,animate){
  seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String((b.dataset.v??b.dataset.mode)===val)));
  placeThumb(seg,animate);
}
function syncOptSegs(animate){document.querySelectorAll(".seg[data-opt]").forEach(s=>{const k=s.dataset.opt;setSeg(s,k==="rule"?rule:opt[k],animate)})}
document.querySelectorAll(".seg[data-opt]").forEach(s=>s.addEventListener("click",e=>{const b=e.target.closest("button");if(b)onOpt(s.dataset.opt,b.dataset.v)}));
function onOpt(k,v){
  if(k==="rule"){
    if(mode==="online"&&room&&!isHost){toast("Only the room creator can change the rule");syncOptSegs(true);return}
    if(v===rule)return;
    rule=v;opt.rule=v;saveOpt();syncOptSegs(true);newRound("X");
    if(mode==="online"&&room)pushState();
    updateInsight();return;
  }
  if(opt[k]===v)return;
  opt[k]=v;saveOpt();syncOptSegs(true);
  if(k==="youAre"&&mode==="ai")setMode("ai");else render();
}

function setMode(m){
  mode=m;app.dataset.mode=m;
  setSeg($("tabs"),m,true);
  document.querySelectorAll("[data-for]").forEach(g=>g.hidden=g.dataset.for!==m);
  document.querySelectorAll("[data-hide]").forEach(g=>g.hidden=g.dataset.hide===m);
  if(m==="ai"){aiSide=other(opt.youAre);names[aiSide]="Computer";names[opt.youAre]="You"}
  else if(m==="local"){names.X="Player X";names.O="Player O"}
  else setOnlineNames();
  newRound("X");
}
$("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.dataset.mode===mode)return;
  if(mode==="online")leave();
  setMode(b.dataset.mode);
});
/* ---------- Online (MQTT relay over secure WebSockets) ---------- */
/* Both players connect to several public brokers at once and send every
   message through all of them. Duplicates are dropped by message id, so the
   game keeps working when one broker is down. No direct peer connection is
   needed, which avoids the NAT and firewall problems of WebRTC. */
const qs=new URLSearchParams(location.search);
const customBroker=qs.get("broker");
const BROKERS=customBroker?[customBroker]:[
  "wss://broker.emqx.io:8084/mqtt",
  "wss://broker.hivemq.com:8884/mqtt",
  "wss://test.mosquitto.org:8081/mqtt"
];
const TOPIC="xnofade/v1/";
const JOIN_TIMEOUT=20000,PING_EVERY=4000,PEER_LOST=12000;
function code(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function net(msg){$("netNote").textContent=msg||""}
function setOnlineNames(){names.X=me?(me==="X"?"You":"Friend"):"Player X";names.O=me?(me==="O"?"You":"Friend"):"Player O"}
function linkFor(c){return location.origin+location.pathname+"?room="+c+(customBroker?"&broker="+encodeURIComponent(customBroker):"")}
function liveBrokers(){return clients.filter(c=>c.connected).length}
function netState(){if(!room)return"idle";if(rejected)return"full";if(connOpen)return"live";if(partner)return"lost";return isHost?"host-wait":"guest-wait"}

function snapshot(){return{X:marks.X.slice(),O:marks.O.slice(),turn,starter,over,score:{X:score.X,O:score.O},rule}}
function validCells(a){return Array.isArray(a)&&a.length<=3&&a.every(c=>Number.isInteger(c)&&c>=0&&c<9)&&new Set(a).size===a.length}
function adopt(s,v){
  if(!s||!validCells(s.X)||!validCells(s.O))return;
  if(s.X.some(c=>s.O.includes(c)))return;
  if(!["X","O"].includes(s.turn)||!["X","O"].includes(s.starter)||!["A","B"].includes(s.rule))return;
  marks={X:s.X.slice(),O:s.O.slice()};turn=s.turn;starter=s.starter;rule=s.rule;syncOptSegs(true);
  over=!!s.over;winCells=over?winLine(marks[turn]):null;if(over&&!winCells)over=false;
  if(s.score&&Number.isInteger(s.score.X)&&Number.isInteger(s.score.O))score={X:s.score.X,O:s.score.O};
  history=[];version=v;saveSession();render();
}
function saveSession(){try{sessionStorage.setItem("xo.online",JSON.stringify({room,isHost,myId,partner,version,state:snapshot()}))}catch(e){}}
function clearSession(){try{sessionStorage.removeItem("xo.online")}catch(e){}}

function publish(o){
  if(!room)return;
  o.from=myId;o.mid=myId+":"+(++seq);
  const payload=JSON.stringify(o);
  for(const c of clients){try{if(c.connected)c.publish(TOPIC+room,payload,{qos:1})}catch(e){}}
}
/* called after every local change while online */
function pushState(){version++;saveSession();publish({t:"state",v:version,s:snapshot()})}

function connectBrokers(onReady){
  if(typeof mqtt==="undefined"){net("Online play could not load. Reload the page.");return false}
  let readyFired=false;
  clients=BROKERS.map(url=>{
    const c=mqtt.connect(url,{clientId:"xno_"+myId+"_"+Math.random().toString(36).slice(2,6),clean:true,
      connectTimeout:8000,reconnectPeriod:3000,keepalive:30,
      will:{topic:TOPIC+room,payload:JSON.stringify({t:"bye",from:myId,mid:myId+":bye"}),qos:0,retain:false}});
    c.on("connect",()=>{
      c.subscribe(TOPIC+room,{qos:1},err=>{
        if(err)return;
        if(!readyFired){readyFired=true;onReady()}
        else if(partner)publish({t:"ping"});
        updateNetStatus();
      });
    });
    c.on("message",(t,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(e){return}onMessage(m)});
    c.on("close",updateNetStatus);
    c.on("error",()=>{});
    return c;
  });
  setTimeout(()=>{if(!readyFired&&room)net("Cannot reach the game server. Still trying…")},10000);
  return true;
}

function startPing(){
  clearInterval(pingTimer);
  pingTimer=setInterval(()=>{
    if(!room)return;
    publish({t:"ping",p:partner});
    if(partner&&connOpen&&Date.now()-partnerSeen>PEER_LOST){connOpen=false;render()}
  },PING_EVERY);
}
function updateNetStatus(){
  if(!room){net("");return}
  net(liveBrokers()===0?"Connection lost. Reconnecting…":"");
}

function begin(c,host,restore){
  leave(true);
  room=c;isHost=host;me=host?"X":"O";
  myId=(restore&&restore.myId)||rid();seq=Math.floor(Math.random()*1e6);seen=new Set();
  if(restore&&typeof restore.partner==="string"){partner=restore.partner;partnerSeen=Date.now()}
  rejected=false;netShown="idle";
  setOnlineNames();
  if(restore&&restore.state){adopt(restore.state,restore.version||0)}
  else{version=0;score={X:0,O:0};newRound("X")}
  saveSession();setUrlRoom(c);
  const ok=connectBrokers(()=>{
    startPing();updateNetStatus();
    if(!host)sendJoin();
    else publish({t:"ping"});
  });
  if(!ok)return;
  if(!host){
    joinDeadline=Date.now()+JOIN_TIMEOUT;
    clearInterval(joinTimer);
    joinTimer=setInterval(()=>{
      if(partner||rejected){clearInterval(joinTimer);return}
      if(Date.now()>joinDeadline){net("No answer yet. Check the code, and that your friend still has the game open.");joinDeadline=Infinity}
      if(liveBrokers())sendJoin();
    },2000);
  }
  render();
}
function setUrlRoom(c){
  try{const u=new URL(location.href);if(c)u.searchParams.set("room",c);else u.searchParams.delete("room");window.history.replaceState(null,"",u)}catch(e){}
}
function sendJoin(){publish({t:"join",v:version,s:snapshot()})}

function onMessage(m){
  if(!m||typeof m!=="object"||typeof m.from!=="string"||typeof m.mid!=="string")return;
  if(m.from===myId||seen.has(m.mid))return;
  if(qs.has("debug"))console.log("[xo]",isHost?"host":"guest",JSON.stringify(m));
  seen.add(m.mid);if(seen.size>2000)seen=new Set([...seen].slice(-500));
  if(m.to&&m.to!==myId)return;
  const fromPartner=partner&&m.from===partner;
  const partnerStale=!partner||Date.now()-partnerSeen>PEER_LOST;

  if(isHost&&m.t==="join"){
    if(!fromPartner&&!partnerStale){publish({t:"full",to:m.from});return}
    partner=m.from;markSeen();
    // keep whichever side has the newer game, so a refresh does not lose the game
    if(Number.isInteger(m.v)&&m.v>version)adopt(m.s,m.v);
    publish({t:"welcome",to:m.from,v:version,s:snapshot()});
    return;
  }
  if(!isHost&&m.t==="welcome"){
    if(partner&&m.from!==partner&&!partnerStale)return;
    partner=m.from;markSeen();clearInterval(joinTimer);
    if(Number.isInteger(m.v))adopt(m.s,m.v);
    return;
  }
  if(!isHost&&m.t==="full"){
    if(!partner||!connOpen){rejected=true;clearInterval(joinTimer);otpError("That room already has two players");render()}
    return;
  }
  if(!fromPartner){
    // host came back after a refresh: ask again
    if(!isHost&&!rejected&&m.t==="ping"&&partnerStale)sendJoin();
    return;
  }
  if(m.t==="bye"){connOpen=false;partnerSeen=0;render();return}
  markSeen();
  // the host refreshed and forgot us: join again so both sides sync
  if(!isHost&&m.t==="ping"&&m.p!==myId){sendJoin();return}
  if(m.t==="state"&&Number.isInteger(m.v)&&m.v>version)adopt(m.s,m.v);
}
function markSeen(){
  partnerSeen=Date.now();saveSession();
  if(!connOpen){connOpen=true;updateNetStatus();render()}
}

function createRoom(){begin(code(),true,null)}
function joinRoom(c){
  c=cleanCode(c);
  if(c.length<5){otpError("Codes have 5 letters or numbers");return}
  if(room===c&&!rejected)return;
  setOtp(c,{auto:false});
  begin(c,false,null);
}
function leave(silent){
  if(room&&!silent)publish({t:"bye"});
  clearInterval(pingTimer);clearInterval(joinTimer);clearTimeout(joinedTimer);
  const old=clients;clients=[];
  setTimeout(()=>old.forEach(c=>{try{c.end(true)}catch(e){}}),silent?0:300);
  room=null;partner=null;connOpen=false;me=null;rejected=false;netShown="idle";
  if(!silent){clearSession();setUrlRoom(null);net("")}
}
function leaveAndReset(){leave();setOnlineNames();setOtp("",{auto:false});newRound("X")}
$("createRoom").addEventListener("click",createRoom);
$("leaveRoom").addEventListener("click",leaveAndReset);
$("chipLeave").addEventListener("click",leaveAndReset);

/* ---------- Online UI: room card, seats, chip, toast ---------- */
let toastT=null;
function toast(text,orb){
  const t=$("toast"),o=$("toastOrb");$("toastTxt").textContent=text;
  o.hidden=!orb;if(orb)o.className="orb "+orb;t.classList.toggle("plain",!orb);
  t.classList.remove("show");void t.offsetWidth;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2800);
}
function setText(el,txt){if(el.textContent===txt)return;el.textContent=txt;if(!still){el.classList.remove("swap");void el.offsetWidth;el.classList.add("swap")}}
const canShare=!!navigator.share&&matchMedia("(pointer:coarse)").matches;

function renderNet(){
  if(mode!=="online"){app.dataset.net="idle";$("chip").hidden=true;return}
  const st=netState();
  if(st==="live"&&(netShown==="idle"||netShown==="host-wait"||netShown==="guest-wait"||netShown==="full")){
    /* the room fills: the empty seat pops into an orb, the code fuses into a
       capsule for the one who joined, then the cards make way for the board */
    netShown="joined";
    toast(isHost?"Your friend joined the room":"You're in. You play O","friend");
    clearTimeout(joinedTimer);joinedTimer=setTimeout(()=>{if(netShown==="joined"){netShown="live";render()}},still?0:1200);
  }else if(netShown==="joined"&&st==="live"){/* hold the moment */}
  else{
    if(st==="lost"&&netShown==="live")toast("Your friend left the room");
    if(st==="live"&&netShown==="lost")toast("Your friend is back","friend");
    netShown=st;
  }
  app.dataset.net=netShown;
  const s=netShown,joined=s==="joined";
  setText($("rcTitle"),{idle:"Play a friend","host-wait":"Your room","guest-wait":"Joining room",full:"Room is full",joined:isHost?"Your room":"Joined"}[s]||"Your room");
  const pill=$("rcPill"),pt={"host-wait":"1 of 2","guest-wait":room||"",joined:"2 of 2"}[s];
  pill.hidden=!pt;if(pt)setText(pill,pt);
  $("meOrb").className="orb"+(me==="O"?" o":"");
  const seat=$("seat"),seatState=joined?"filled":(s==="host-wait"||s==="guest-wait")?"waiting":"empty";
  if(seat.dataset.state!==seatState)seat.dataset.state=seatState;
  setText($("seatName"),joined?(isHost?"Friend":"Host"):s==="host-wait"?"Waiting":s==="guest-wait"?"Host":"Friend");
  $("codeRow").hidden=!(isHost&&(s==="host-wait"||joined));
  $("rcCode").textContent=room||"";
  $("createRoom").hidden=!(s==="idle"||s==="full");
  $("inviteBtn").hidden=s!=="host-wait";
  $("leaveRoom").hidden=!(s==="host-wait"||s==="guest-wait");
  $("leaveRoom").textContent=s==="guest-wait"?"Cancel":"Leave";
  if(!$("inviteBtn").dataset.busy)$("inviteLbl").textContent=canShare?"Share invite":"Copy invite link";
  otpEl.classList.toggle("busy",s==="guest-wait");
  otpEl.classList.toggle("done",joined&&!isHost);
  otpIn.disabled=s==="guest-wait"||joined;
  const chip=$("chip"),showChip=s==="live"||s==="lost";
  chip.hidden=!showChip;
  if(showChip){$("chipMe").className="orb"+(me==="O"?" o":"");$("chipFriend").className="orb friend"+(s==="lost"?" away":"");$("chipCode").textContent=room||""}
}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}
$("copyCode").addEventListener("click",async()=>{toast(await copyText(room||"")?"Code copied":"Copy failed")});
$("inviteBtn").addEventListener("click",async()=>{
  const url=linkFor(room);
  if(canShare){navigator.share({title:"X n O",text:"Play X n O with me. Code "+room,url}).catch(()=>{});return}
  const ok=await copyText(url),b=$("inviteBtn"),l=$("inviteLbl");
  b.dataset.busy="1";setText(l,ok?"Link copied":"Copy failed");
  setTimeout(()=>{delete b.dataset.busy;setText(l,"Copy invite link")},1600);
});

/* ---------- One-time code: five cells, one invisible field ---------- */
/* One real input over the row keeps paste, autofill and screen readers
   working; the cells are drawn underneath it. Characters rise into their
   cells, a full row joins by itself, and a wrong one shivers and drains. */
const otpEl=$("otp"),otpIn=$("otpInput"),otpCells=[...otpEl.querySelectorAll(".c")];
let otpVal="";
function cleanCode(v){return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)}
function extractCode(t){
  try{const u=new URL(String(t).trim());const r=u.searchParams.get("room");if(r)return cleanCode(r).slice(0,5)}catch(e){}
  const m=String(t||"").toUpperCase().match(/[A-Z0-9]{5,6}/);return m?cleanCode(m[0]).slice(0,5):""
}
function setOtp(v,o){
  const auto=!o||o.auto!==false;
  v=cleanCode(v).slice(0,5);const prev=otpVal;otpVal=v;if(otpIn.value!==v)otpIn.value=v;
  otpCells.forEach((c,i)=>{
    const ch=v[i]||"",cur=c.firstChild?c.firstChild.textContent:"";
    if(ch!==cur){
      c.textContent="";
      if(ch){const s=document.createElement("span");s.textContent=ch;
        if(i>=prev.length&&!still)s.style.animationDelay=((i-prev.length)*45)+"ms";else s.style.animation="none";c.appendChild(s)}
    }
    c.classList.toggle("has",!!ch);
  });
  updateCaret();
  $("joinBtn").disabled=v.length!==5;
  if(auto&&v.length===5&&prev.length<5)joinRoom(v);
}
function updateCaret(){const f=document.activeElement===otpIn;otpCells.forEach((c,i)=>c.classList.toggle("on",f&&i===Math.min(otpVal.length,4)))}
function otpError(msg){
  if(msg)toast(msg);
  otpEl.classList.remove("shake");void otpEl.offsetWidth;otpEl.classList.add("shake");
  setTimeout(()=>{otpEl.classList.remove("shake");setOtp("",{auto:false})},still?0:620);
}
otpIn.addEventListener("input",()=>setOtp(otpIn.value));
otpIn.addEventListener("paste",e=>{const t=(e.clipboardData||window.clipboardData)?.getData("text");if(t==null)return;e.preventDefault();const c=extractCode(t);c?setOtp(c):otpError("No room code in what you pasted")});
otpIn.addEventListener("focus",updateCaret);otpIn.addEventListener("blur",updateCaret);
otpIn.addEventListener("keydown",e=>{if(e.key==="Enter"&&otpVal.length===5)joinRoom(otpVal)});
$("pasteBtn").addEventListener("click",async()=>{
  try{const t=await navigator.clipboard.readText();const c=extractCode(t);c?setOtp(c):otpError("No room code on the clipboard")}
  catch(e){otpIn.focus();toast("Paste the code with your keyboard")}
});
$("joinBtn").addEventListener("click",()=>{otpVal.length===5?joinRoom(otpVal):otpError("Codes have 5 letters or numbers")});
/* ---------- Result wave (distortion-waves, MIT) ---------- */
/* When a round ends, a colourful ring opens from the winning move and carries
   the board into the result. Play again collapses it back into the board.
   Without WebGL 2 or with reduced motion the library crossfades. If the module
   fails to load, the result simply appears. */
const boardWrap=$("boardWrap"),resultEl=$("result");
let wave=null,waveShown=false,reviewing=false,waveTimer=null;
import("./wave.js").then(m=>{
  try{wave=new m.WaveController(boardWrap,boardEl,resultEl);wave.update({type:"center",palette:"colorful",revealed:waveShown,onFinish:focusResult})}
  catch(e){wave=null}
}).catch(()=>{});
function fillResult(){
  const w=names[turn],k=kindOf(turn);
  $("resOrb").className="orb"+(k?" "+k:"");
  const cls=turn.toLowerCase();
  $("resTitle").innerHTML=w==="You"?"You win!":mode==="ai"&&turn===aiSide?"Computer wins":mode==="online"?"Friend wins":`<span class="${cls}">${turn}</span> wins`;
  $("resScore").innerHTML=`${esc(names.X)} <b>${score.X}</b> : <b>${score.O}</b> ${esc(names.O)}`;
}
function showResult(show){
  waveShown=show;
  if(show)fillResult();
  if(wave){
    const last=marks[turn][marks[turn].length-1];
    wave.update({type:"center",palette:"colorful",revealed:show,source:show&&last!=null?cells[last]:undefined,onFinish:focusResult});
  }else{
    resultEl.style.opacity=show?"1":"0";resultEl.style.pointerEvents=show?"auto":"none";
    resultEl.toggleAttribute("inert",!show);boardEl.toggleAttribute("inert",show);
    show?resultEl.removeAttribute("aria-hidden"):resultEl.setAttribute("aria-hidden","true");
    if(show)focusResult(true);
  }
}
function focusResult(revealed){if(revealed&&waveShown&&!openDlg)$("playAgain").focus({preventScroll:true})}
function syncWave(){
  const want=over&&!reviewing;
  if(!over)reviewing=false;
  if(want&&!waveShown){
    if(!waveTimer)waveTimer=setTimeout(()=>{waveTimer=null;if(over&&!reviewing&&!waveShown)showResult(true)},still?0:750);
  }else if(!want){
    clearTimeout(waveTimer);waveTimer=null;
    if(waveShown)showResult(false);
  }
}
$("playAgain").addEventListener("click",()=>$("newBtn").click());
$("seeBoard").addEventListener("click",()=>{reviewing=true;syncWave()});

/* ---------- Dialogs: pop-over, modal, bottom sheet ---------- */
/* On wide screens settings unfold out of their button's corner and the
   rules and analysis open as a centred card; on narrow screens all three
   become bottom sheets you can drag away. */
const scrim=$("scrim"),narrowMQ=matchMedia("(max-width:1079px)");
let openDlg=null,openerBtn=null;
function openFrames(d){
  if(narrowMQ.matches)return[{transform:"translateY(100%)"},{transform:"none"}];
  if(d.classList.contains("pop"))return[{opacity:0,transform:"translateY(-10px) scale(.86,.72)"},{opacity:1,transform:"none"}];
  return[{opacity:0,transform:"translateY(12px) scale(.9)"},{opacity:1,transform:"none"}];
}
function closeFrames(d){
  if(narrowMQ.matches)return[{transform:getComputedStyle(d).transform==="none"?"none":getComputedStyle(d).transform},{transform:"translateY(100%)"}];
  if(d.classList.contains("pop"))return[{opacity:1,transform:"none"},{opacity:0,transform:"translateY(-8px) scale(.92,.86)"}];
  return[{opacity:1,transform:"none"},{opacity:0,transform:"scale(.96)"}];
}
function restartStag(d){
  let i=0;d.querySelectorAll(".stag").forEach(el=>{if(el.hidden)return;if(!el.style.getPropertyValue("--i")||el.dataset.auto){el.dataset.auto="1";el.style.setProperty("--i",i)}i++;
    if(still)return;el.style.animation="none";void el.offsetWidth;el.style.animation=""});
}
function openDialog(id,btn){
  if(openDlg){const same=openDlg.id===id;closeDialog(true);if(same)return}
  const d=$(id);openDlg=d;openerBtn=btn||null;
  if(id==="dlgRules")buildRules();
  if(id==="dlgInsight")updateInsight(true);
  d.hidden=false;scrim.hidden=false;d.style.transform="";
  scrim.classList.toggle("clear",d.classList.contains("pop")&&!narrowMQ.matches);
  requestAnimationFrame(()=>scrim.classList.add("show"));
  app.inert=true;if(btn)btn.setAttribute("aria-expanded","true");
  syncOptSegs(false);restartStag(d);
  if(!still)d.animate(openFrames(d),{duration:narrowMQ.matches?560:480,easing:narrowMQ.matches?"cubic-bezier(.2,1.1,.3,1)":"cubic-bezier(.34,1.36,.64,1)"});
  setTimeout(()=>{if(openDlg===d)d.focus({preventScroll:true})},20);
}
function closeDialog(instant){
  const d=openDlg;if(!d)return;openDlg=null;app.inert=false;
  const btn=openerBtn;openerBtn=null;if(btn)btn.setAttribute("aria-expanded","false");
  scrim.classList.remove("show");
  const done=()=>{d.hidden=true;d.style.transform="";if(!openDlg)scrim.hidden=true};
  if(instant||still)done();
  else{const a=d.animate(closeFrames(d),{duration:narrowMQ.matches?260:180,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"});a.onfinish=()=>{a.cancel();done()}}
  if(btn&&!instant)btn.focus({preventScroll:true});
}
$("btnSettings").addEventListener("click",e=>openDialog("dlgSettings",e.currentTarget));
$("btnRules").addEventListener("click",e=>openDialog("dlgRules",e.currentTarget));
$("btnInsight").addEventListener("click",e=>openDialog("dlgInsight",e.currentTarget));
scrim.addEventListener("click",()=>closeDialog());
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeDialog()));
document.addEventListener("keydown",e=>{
  if(!openDlg)return;
  if(e.key==="Escape"){e.preventDefault();closeDialog();return}
  if(e.key==="Tab"){ // keep focus inside the open dialog
    const f=[...openDlg.querySelectorAll("button,input,[tabindex]:not([tabindex='-1'])")].filter(x=>!x.disabled&&x.offsetParent);
    if(!f.length)return;const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===openDlg)){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
/* drag a sheet down to put it away */
document.querySelectorAll(".dlg").forEach(d=>{
  let y0=null,dy=0;
  d.addEventListener("pointerdown",e=>{
    if(!narrowMQ.matches||openDlg!==d)return;
    if(!e.target.closest(".grab,.dlg-head")||e.target.closest("button"))return;
    y0=e.clientY;dy=0;d.setPointerCapture(e.pointerId);d.style.transition="none";
  });
  d.addEventListener("pointermove",e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);d.style.transform=`translateY(${dy}px)`});
  const end=()=>{if(y0==null)return;y0=null;d.style.transition="";
    if(dy>90)closeDialog();
    else if(!still){const a=d.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],{duration:420,easing:"cubic-bezier(.34,1.56,.64,1)"});a.onfinish=()=>d.style.transform="";d.style.transform=""}
    else d.style.transform="";};
  d.addEventListener("pointerup",end);d.addEventListener("pointercancel",end);
});

/* ---------- Rules: four rules, four small boards ---------- */
let rulesBuilt=false;
function buildRules(){
  if(rulesBuilt)return;rulesBuilt=true;
  const R=[
    {n:"01",t:"Three in a row wins",m:"XO.OX...X",k:{0:"k-win",4:"k-win",8:"k-win"}},
    {n:"02",t:"Three marks each, never more",m:".X.X.O.OX",k:{},b:"3 / 3"},
    {n:"03",t:"A fourth mark removes your oldest",m:"XOX.X..O.",k:{0:"k-gone",2:"k-new"}},
    {n:"04",t:"Your oldest blinks before it goes",m:"XO..X.XO.",k:{0:"k-old"}}
  ];
  $("rulesGrid").innerHTML=R.map((r,i)=>`<figure class="rule stag" style="--i:${i}"><div class="mini" aria-hidden="true">${
    r.m.split("").map((c,j)=>`<i class="${c==="."?"":c} ${r.k[j]||""}">${c==="."?"":c}</i>`).join("")}${r.b?`<span class="badge">${r.b}</span>`:""}</div><figcaption><span class="num">${r.n}</span>${r.t}</figcaption></figure>`).join("");
}

/* ---------- Can it be won? ---------- */
function countUp(el,to){
  if(still){el.textContent=to.toLocaleString("en-US");return}
  const t0=performance.now(),dur=900;
  const step=t=>{const u=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-u,3);el.textContent=Math.round(to*e).toLocaleString("en-US");if(u<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function updateInsight(opening){
  const firsts=evalMoves([],[],rule),{count}=solve(rule);
  const wins=firsts.filter(m=>m.v==="W");
  $("heat").innerHTML=firsts.map((m,i)=>`<i class="${m.v==="W"?"W":""} stag" style="--i:${i}">${m.v==="W"?"Win":"Draw"}${m.v==="W"?`<small>in ${Math.ceil(m.d/2)}</small>`:""}</i>`).join("");
  $("insTitle").textContent=wins.length?"Yes.":"No.";
  $("insSub").textContent=wins.length?"X wins by opening on an edge.":"Best play from both sides ends in a draw.";
  $("statMoves").textContent=wins.length?String(Math.ceil(Math.min(...wins.map(m=>m.d))/2)):"Draw";
  $("statMoves").nextElementSibling.textContent=wins.length?"moves to force it":"with best play";
  if(opening)countUp($("statPos"),count);else $("statPos").textContent=count.toLocaleString("en-US");
  if(openDlg&&openDlg.id==="dlgInsight")restartStag($("heat"));
}

/* ---------- Theme ---------- */
const root=document.documentElement;
const savedTheme=store.get("xo.theme",null);if(savedTheme==="light"||savedTheme==="dark")root.dataset.theme=savedTheme;
function themeMeta(){document.querySelector('meta[name="theme-color"]').content=root.dataset.theme==="light"?"#f6f6f7":"#101011"}
themeMeta();
$("btnTheme").addEventListener("click",()=>{root.dataset.theme=root.dataset.theme==="light"?"dark":"light";store.set("xo.theme",root.dataset.theme);themeMeta()});

/* ---------- Layout upkeep ---------- */
function placeAll(){placeThumb($("tabs"),false);document.querySelectorAll(".seg[data-opt]").forEach(s=>placeThumb(s,false))}
addEventListener("resize",placeAll);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeAll);
narrowMQ.addEventListener?.("change",()=>{if(openDlg)closeDialog(true);placeAll()});

/* ---------- Boot ---------- */
const roomParam=cleanCode(qs.get("room")||"");
let saved=null;try{saved=JSON.parse(sessionStorage.getItem("xo.online")||"null")}catch(e){}
if(saved&&saved.room&&(saved.isHost?(!roomParam||roomParam===saved.room):roomParam===saved.room)){
  setMode("online");begin(saved.room,!!saved.isHost,saved);
}else if(roomParam){setMode("online");joinRoom(roomParam)}
else setMode("local");
placeAll();
})();
