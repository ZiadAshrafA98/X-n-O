<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empty board options</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#101011;--slab:#1c1c1e;--ink:#f5f5f5;--mute:#9b9ba1;--faint:#8a8a90;--chip:rgba(255,255,255,.06);--chip-2:rgba(255,255,255,.1);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding:32px 16px 48px}
h1{font-size:22px;font-weight:600;margin:0 auto 4px;max-width:1080px}p.lead{max-width:1080px;margin:0 auto 24px;color:var(--mute)}
.grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.opt{margin:0;display:flex;flex-direction:column;gap:12px}
.sheet{background:var(--slab);border-radius:24px;height:300px;display:flex}
.lb-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
.v{width:180px;height:auto;overflow:visible}
.et{font-size:16px;font-weight:600}
.cta{height:44px;padding:0 18px;border:0;border-radius:99px;background:var(--ink);color:#0d0d0d;font:500 14px Inter,sans-serif}
figcaption{display:flex;flex-direction:column;gap:2px;padding:0 4px}figcaption b{font-weight:600}figcaption span{font-size:13px;color:var(--mute)}
.ghost{fill:var(--chip-2)} .st{fill:#2a2a2e} .top{fill:#38383d} .st.g{fill:#3b3320} .top.g{fill:#5a4a22}
.n{font:700 14px Inter;fill:var(--faint);text-anchor:middle}.n.g{fill:#e0b040}
.a-q{font:700 14px Inter;fill:#f2c14e;text-anchor:middle;animation:pulse 2s ease-in-out infinite}
.a-seat{fill:rgba(242,193,78,.08);stroke:rgba(242,193,78,.7);stroke-width:2;stroke-dasharray:4 4;animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
.a-beam{animation:beam 3s ease-in-out infinite;transform-origin:100px 0}
.a-crown,.c-crown,.b-cup{animation:float 2.8s ease-in-out infinite}
.b-shine{animation:shine 3s ease-in-out infinite}
.b-plate{fill:none;stroke:#7a5512;stroke-width:1.4;stroke-dasharray:3 3}
.sp{fill:#f2c14e;opacity:0;animation:spark 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sp.k2{animation-delay:.9s}.sp.k3{animation-delay:1.8s}
.row{fill:var(--chip)} .row.r1{fill:rgba(242,193,78,.1);stroke:rgba(242,193,78,.45);stroke-width:1.2}
.rk{font:700 11px Inter;fill:#2a1d05;text-anchor:middle}.rk2{font:600 11px Inter;fill:var(--faint);text-anchor:middle}
.c-slot{fill:none;stroke:rgba(242,193,78,.6);stroke-width:1.6;stroke-dasharray:3 3}
.c-me{animation:me 4s cubic-bezier(.34,1.3,.6,1) infinite}
.c-name{fill:var(--chip-2);animation:name 4s ease infinite}
.c-crown{animation:ccrown 4s cubic-bezier(.34,1.4,.6,1) infinite}
.cellr{fill:var(--chip)}
.d-x{fill:none;stroke:#ff7a5c;stroke-width:4;stroke-linecap:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw 4.2s ease infinite}.d2{animation-name:draw2}.d3{animation-name:draw3}
.d-o{fill:none;stroke:#5aa2ff;stroke-width:3.4;opacity:.8}
.d-line{fill:none;stroke:#f5f5f5;stroke-width:4;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:line 4.2s ease infinite}
.d-crown{animation:drop 4.2s cubic-bezier(.34,1.5,.6,1) infinite}
@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beam{0%,100%{opacity:.7;transform:scaleX(.92)}50%{opacity:1;transform:scaleX(1.05)}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes shine{0%,30%{transform:translateX(0) skewX(-20deg)}70%,100%{transform:translateX(120px) skewX(-20deg)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}40%{opacity:.95;transform:scale(1)}70%{opacity:0;transform:scale(.6) rotate(45deg)}}
@keyframes me{0%,8%{transform:translateY(70px);opacity:0}30%,78%{transform:none;opacity:1}92%,100%{transform:translateY(70px);opacity:0}}
@keyframes name{0%,20%{opacity:.4;width:0}38%,80%{opacity:1;width:50px}95%,100%{opacity:.4;width:0}}
@keyframes ccrown{0%,30%{transform:translateY(-14px);opacity:0}44%,78%{transform:none;opacity:1}90%,100%{transform:translateY(-14px);opacity:0}}
@keyframes draw{0%,6%{stroke-dashoffset:40}16%,86%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:40}}
@keyframes draw2{0%,18%{stroke-dashoffset:40}28%,86%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:40}}
@keyframes draw3{0%,30%{stroke-dashoffset:40}40%,86%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:40}}
@keyframes line{0%,44%{stroke-dashoffset:120}56%,86%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:120}}
@keyframes drop{0%,56%{transform:translateY(-30px);opacity:0}68%,86%{transform:none;opacity:1}96%,100%{transform:translateY(-30px);opacity:0}}
</style></head><body><h1>Empty leaderboard: pick a visual</h1><p class="lead">Each one sits above the same short title and button. All four move on a loop; the one you pick also gets a light-theme version.</p>
