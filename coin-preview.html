<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#101011;--slab:#1c1c1e;--ink-t:#f5f5f5;--mute:#9b9ba1;--T:18px;--m1:#fbfcfd;--m2:#c9ced6;--m3:#7c838e;--hi:#ffffff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink-t);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:640px;padding:36px 20px 0;text-align:center}
header h1{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:-.02em}
header p{margin:0 auto;color:var(--mute);font-size:15px;line-height:1.5;max-width:460px}
.card{width:min(560px,calc(100% - 32px));margin:22px 0 40px;background:var(--slab);border-radius:30px;padding:16px 16px 26px;display:flex;flex-direction:column;align-items:center}
/* a stage seen from slightly above, with a soft floor for the coin to land on */
.stage{position:relative;width:100%;height:420px;perspective:1100px;perspective-origin:50% 20%;touch-action:none;cursor:grab;user-select:none;overflow:hidden;border-radius:22px;
  background:radial-gradient(ellipse 70% 40% at 50% 78%,rgba(255,255,255,.06),transparent 70%)}
.stage:active{cursor:grabbing}
.ground{position:absolute;left:50%;top:70%;width:200px;height:200px;margin:-100px 0 0 -100px;transform-style:preserve-3d}
.toss{position:absolute;inset:0;transform-style:preserve-3d}
.coin{position:absolute;inset:0;transform-style:preserve-3d}
.edge{position:absolute;inset:0;border-radius:50%;transform:translateZ(calc(var(--z) * 1px));background:repeating-conic-gradient(from 0deg,var(--m2) 0 1.6deg,var(--m3) 1.6deg 3.2deg)}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.f{transform:translateZ(calc(var(--T) / 2))}
/* the back is turned over the same axis the coin flips on, so it lands the right way up */
.face.b{transform:rotateX(180deg) translateZ(calc(var(--T) / 2))}
.field{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,var(--hi) 0%,var(--m1) 18%,var(--m2) 58%,var(--m3) 100%);
  box-shadow:inset 0 0 0 7px var(--m2),inset 0 0 0 8px var(--m3),inset 0 0 0 9px rgba(255,255,255,.7),inset 0 0 0 16px var(--m2),inset 0 0 0 17px var(--m3),inset 3px 4px 10px rgba(255,255,255,.3),inset -6px -8px 16px rgba(0,0,0,.35)}
.medal{position:absolute;inset:24%;border-radius:50%;padding:6px;background:linear-gradient(145deg,var(--m3),var(--hi) 55%,var(--m2));box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.2)}
.medal span{display:block;width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center;box-shadow:inset 0 3px 8px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.25)}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(var(--sa,115deg),rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 48%,rgba(255,255,255,0) 64%)}
/* the shadow lies on the floor, flattened by the same angle as the coin at rest */
.shadow{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,.25) 70%,transparent);transform:rotateX(62deg) translateZ(-10px);filter:blur(3px)}
.res{margin:14px 0 14px;font-weight:500;min-height:22px;text-align:center}
.hint{margin:0 0 14px;color:var(--mute);font-size:14px}
.btn{height:48px;padding:0 30px;border:0;border-radius:999px;background:#f5f5f5;color:#0d0d0d;font:600 15px Inter,system-ui,sans-serif;cursor:pointer;transition:scale .15s}
.btn:active{scale:.95}.btn:disabled{opacity:.5}
</style></head><body>

  <p class="res" id="res" aria-live="polite">Your avatar is up. Toss to see who picks first.</p>
  <p class="hint">Flick the coin upward, or press Toss. Drag sideways to spin it on the table.</p>
  <button class="btn" id="go" type="button">Toss</button>
</div>
<script>
const coin=document.getElementById('coin'),toss=document.getElementById('toss'),shadow=document.getElementById('shadow'),stage=document.getElementById('stage'),res=document.getElementById('res'),go=document.getElementById('go');
const REST=62;          /* lying on the ground, seen from above at an angle */
let up='f',spin=0,busy=false;
const pose=(rx,ry,rz)=>'rotateX('+rx+'deg) rotateY('+(ry||0)+'deg) rotateZ('+(rz||0)+'deg)';
const rest=()=>REST+(up==='b'?180:0);
function show(){coin.style.transform=pose(rest(),0,spin);document.querySelectorAll('.sheen').forEach(s=>s.style.setProperty('--sa',(115+spin*.8)+'deg'))}
show();
/* drag sideways: turn the coin where it lies. Flick upward: toss it */
let drag=null,trail=[];
stage.addEventListener('pointerdown',e=>{if(busy)return;drag={x:e.clientX,spin};trail=[{y:e.clientY,t:performance.now()}];stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;spin=drag.spin+(e.clientX-drag.x)*.5;show();trail.push({y:e.clientY,t:performance.now()});if(trail.length>6)trail.shift()});
const release=()=>{if(!drag)return;drag=null;const a=trail[0],b=trail[trail.length-1],v=b&&a&&b.t>a.t?(a.y-b.y)/(b.t-a.t):0;if(v>.55)flip(Math.min(2.2,v))};
stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
go.addEventListener('click',()=>flip(1));
function flip(power){
  if(busy)return;busy=true;go.disabled=true;res.textContent='…';
  const next=Math.random()<.5?'f':'b';
  const start=rest(),turns=Math.round(3+power*2.5),
        land=REST+(next==='b'?180:0)+turns*360,   /* where it will finally lie */
        H=170+power*70,D=2000+power*250,tilt=26,sp=spin;
  const y=v=>'translateY('+v+'px)';
  /* height: up, down to the ground, one small bounce, a tiny second one, still */
  toss.animate([{transform:y(0),easing:'cubic-bezier(.2,.6,.35,1)'},{transform:y(-H),offset:.36,easing:'cubic-bezier(.55,0,.85,.4)'},
    {transform:y(0),offset:.68,easing:'cubic-bezier(.2,.7,.4,1)'},{transform:y(-18),offset:.76,easing:'cubic-bezier(.5,0,.8,.5)'},
    {transform:y(0),offset:.83,easing:'cubic-bezier(.2,.7,.4,1)'},{transform:y(-4),offset:.87,easing:'cubic-bezier(.5,0,.8,.5)'},{transform:y(0),offset:.9},{transform:y(0)}],{duration:D});
  /* turning: end over end in the air, it meets the ground tilted, rocks back and forth, smaller each time, and lies flat */
  coin.animate([{transform:pose(start,0,sp),easing:'cubic-bezier(.25,.6,.45,1)'},
    {transform:pose(land-tilt,8,sp+14),offset:.68,easing:'cubic-bezier(.3,.6,.5,1)'},
    {transform:pose(land+12,-7,sp+8),offset:.76},
    {transform:pose(land-7,5,sp+4),offset:.83},
    {transform:pose(land+4,-3,sp+2),offset:.89},
    {transform:pose(land-1.5,1,sp+.5),offset:.95},
    {transform:pose(land,0,sp)}],{duration:D,fill:'forwards'}).onfinish=a=>{a.target.cancel();up=next;spin=sp;show();busy=false;go.disabled=false;
      res.textContent=next==='f'?'You won the toss':'Your friend won the toss'};
  /* the shadow shrinks and fades while the coin is up, and is sharp again on landing */
  shadow.animate([{opacity:1,transform:'rotateX(62deg) translateZ(-10px) scale(1)'},{opacity:.3,transform:'rotateX(62deg) translateZ(-10px) scale(.55)',offset:.36},
    {opacity:1,transform:'rotateX(62deg) translateZ(-10px) scale(1)',offset:.68},{opacity:.85,transform:'rotateX(62deg) translateZ(-10px) scale(.92)',offset:.76},{opacity:1,transform:'rotateX(62deg) translateZ(-10px) scale(1)'}],{duration:D});
}
</script></body></html>
